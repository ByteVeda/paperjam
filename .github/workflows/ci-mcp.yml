name: CI MCP

# Reusable workflow: lint and wheel build for the Python MCP server, which is
# a separate package under mcp-server/. Called by ci.yml when mcp-server
# paths change.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: mcp-server

jobs:
  lint:
    name: Lint (MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        # `uv sync` resolves paperjam from the repo root (tool.uv.sources), so
        # this job compiles the workspace — restore the Cargo cache first.
        uses: ./.github/actions/setup-rust

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python
        with:
          # mcp-server is its own project; sync it from the working directory
          # below rather than the repository root.
          sync: "false"
          cache-dependency-glob: mcp-server/pyproject.toml

      - name: Install dependencies (builds paperjam from source)
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src/

      - name: Ruff format
        run: uv run ruff format --check src/

      - name: Mypy
        run: uv run mypy src/

  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          # A pure-setuptools wheel: no project sync, no Rust build.
          sync: "false"
          cache-dependency-glob: mcp-server/pyproject.toml

      - name: Build wheel
        run: uv build

      - name: Verify CLI
        run: |
          uv run --no-project --with dist/*.whl paperjam-mcp --version
          uv run --no-project --with dist/*.whl paperjam-mcp --help
