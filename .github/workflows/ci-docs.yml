name: CI Docs

# Reusable workflow: the docs site's lint and type-check hooks. Called by
# ci.yml when docs-relevant paths change, so a Rust- or Python-only PR never
# pays for a pnpm install. The full Docusaurus + wasm build lives in docs.yml,
# which is also what publishes the site.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node + pnpm
        uses: ./.github/actions/setup-node

      - name: Run docs hooks
        uses: ./.github/actions/pre-commit
        with:
          skip: ruff-check,ruff-format,mypy,cargo-fmt,clippy,wasm-check
