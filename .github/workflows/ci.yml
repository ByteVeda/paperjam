name: CI

# Thin orchestrator. Every check lives in a per-language reusable workflow;
# this file only decides which of them a given event needs to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-trigger, for when back-to-back squash merges leave main HEAD
  # without a run because concurrency cancelled it.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo. pull-requests:read lets dorny/paths-filter enumerate
# a PR's changed files.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      python: ${{ steps.decide.outputs.python }}
      docs: ${{ steps.decide.outputs.docs }}
      mcp: ${{ steps.decide.outputs.mcp }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Each suite reruns when its own sources, the shared Rust workspace,
          # the composite actions it uses, or its own workflow change.
          filters: |
            shared: &shared
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.pre-commit-config.yaml'
              - '.github/actions/setup-rust/**'
              - '.github/actions/pre-commit/**'
              - '.github/workflows/ci.yml'
            rust:
              - *shared
              - '.github/workflows/ci-rust.yml'
            # The bindings are compiled into the extension, so a crates/ change
            # can break Python at runtime even when no Python source is touched.
            python:
              - *shared
              - 'paperjam/**'
              - 'tests/**'
              - 'examples/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - '.github/actions/setup-python/**'
              - '.github/actions/maturin-build/**'
              - '.github/workflows/ci-python.yml'
            # Deliberately not *shared: these are the biome and tsc hooks over
            # the site's own TypeScript, with no build-time dependency on the
            # Rust workspace. The wasm-backed site build lives in docs.yml.
            docs:
              - 'docs/**'
              - '.pre-commit-config.yaml'
              - '.github/actions/setup-node/**'
              - '.github/actions/pre-commit/**'
              - '.github/workflows/ci-docs.yml'
            # ci-mcp's lint job runs `uv sync`, which resolves paperjam from
            # the repo root via tool.uv.sources and compiles the workspace —
            # so the shared Rust inputs and the Python package can break MCP
            # lint without any mcp-server/ file being touched.
            mcp:
              - *shared
              - 'paperjam/**'
              - 'pyproject.toml'
              - 'mcp-server/**'
              - '.github/actions/setup-python/**'
              - '.github/workflows/ci-mcp.yml'

      - name: Decide which suites run
        id: decide
        # FORCE is true on push and workflow_dispatch — run everything there,
        # so main is always covered by a full run. PRs honor the filter.
        env:
          FORCE: ${{ github.event_name != 'pull_request' }}
          RUST: ${{ steps.filter.outputs.rust }}
          PYTHON: ${{ steps.filter.outputs.python }}
          DOCS: ${{ steps.filter.outputs.docs }}
          MCP: ${{ steps.filter.outputs.mcp }}
        run: |
          decide() {
            if [ "$FORCE" = "true" ] || [ "$2" = "true" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          decide rust "$RUST"
          decide python "$PYTHON"
          decide docs "$DOCS"
          decide mcp "$MCP"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yml

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/ci-python.yml

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/ci-docs.yml

  mcp:
    name: MCP
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/ci-mcp.yml

  # Single required status check. Every suite is skippable, so branch
  # protection cannot depend on them individually — a skipped job never
  # reports. This one always runs and fails if anything it needs did not
  # succeed or skip.
  ci-status:
    name: CI status
    if: always()
    needs: [changes, rust, python, docs, mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that no required job failed
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(','.join(k for k, v in data.items() if v['result'] not in ('success', 'skipped')))
          ")
          if [ -n "$failed" ]; then
            echo "::error::Failing or cancelled jobs: $failed"
            exit 1
          fi
