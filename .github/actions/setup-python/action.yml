name: Set up Python + uv
description: >-
  Installs Python and uv and, by default, syncs the project's dev extra. Jobs
  that only need an interpreter — or that sync a different project, like
  mcp-server — pass `sync: "false"` and run their own `uv sync`.

inputs:
  python-version:
    description: "Python version to install."
    required: false
    default: "3.13"
  sync:
    description: "Run `uv sync` with `sync-args` at the repository root."
    required: false
    default: "true"
  sync-args:
    description: "Arguments passed to `uv sync` when `sync` is true."
    required: false
    default: "--extra dev"
  cache-dependency-glob:
    description: "Files uv keys its dependency cache on."
    required: false
    default: pyproject.toml

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}

    - name: Install Python dependencies
      if: inputs.sync == 'true'
      shell: bash
      env:
        SYNC_ARGS: ${{ inputs.sync-args }}
      # `uv sync` builds the project itself, which compiles the Rust
      # bindings — call this after setup-rust so the build is cached.
      run: |
        # shellcheck disable=SC2086  # deliberate word splitting of the arg list
        uv sync $SYNC_ARGS
